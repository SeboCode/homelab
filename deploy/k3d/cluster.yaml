---
# See configuration here: https://k3d.io/v5.8.3/usage/configfile/
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: homelab-dev-cluster
servers: 1
agents: 1
image: rancher/k3s:v1.36.1-k3s1 # This pins the k3s image and kubernetes version used in local development
ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer
  # syncthing sync port (LoadBalancer Service `sync`)
  - port: 21001:21001/tcp
    nodeFilters:
      - loadbalancer
  - port: 21001:21001/udp
    nodeFilters:
      - loadbalancer

