---
- name: Ensure sshd hardening configuration is present
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config.d/00-hardening.conf
    marker: "# {mark} ANSIBLE MANAGED SSHD HARDENING"
    block: |
      AuthenticationMethods publickey
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      HostKey /etc/ssh/ssh_host_ed25519_key
    create: true
    mode: 0644
  register: sshd_config

- ansible.builtin.include_tasks: "{{ platform }}.yaml"
  when: sshd_config.changed

- name: Ensure ssh directory of the connecting user exists
  ansible.builtin.file:
    path: ~/.ssh
    state: directory
    mode: 0700
  become: false

- name: Ensure authorized keys of the connecting user are present
  ansible.builtin.blockinfile:
    path: ~/.ssh/authorized_keys
    marker: "# {mark} ANSIBLE MANAGED AUTHORIZED KEYS"
    block: "{{ sshd_authorized_keys | join('\n') }}"
    create: true
    mode: 0600
  become: false

