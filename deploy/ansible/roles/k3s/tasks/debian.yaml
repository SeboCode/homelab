---
- name: Ensure apparmor is installed, as containerd needs apparmor_parser on kernels with AppArmor enabled
  ansible.builtin.package:
    name: apparmor
    state: present

- name: Ensure pinned k3s binary is installed
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s.version }}/{{ k3s.binary[ansible_facts['architecture']].name }}"
    checksum: "sha256:{{ k3s.binary[ansible_facts['architecture']].sha256 }}"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: 0755

- name: Ensure k3s config drop-in directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: Ensure homelab k3s config is present
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../k3s/config.yaml"
    dest: /etc/rancher/k3s/config.yaml.d/homelab.yaml
    owner: root
    group: root
    mode: 0600

# Mirrors the unit generated by the upstream install script
- name: Ensure k3s service is present
  ansible.builtin.blockinfile:
    path: /etc/systemd/system/k3s.service
    marker: "# {mark} ANSIBLE MANAGED K3S SERVICE"
    block: |
      [Unit]
      Description=Lightweight Kubernetes
      Documentation=https://k3s.io
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=notify
      # Only stop k3s itself, running pods survive a restart
      KillMode=process
      Delegate=yes
      LimitNOFILE=1048576
      LimitNPROC=infinity
      LimitCORE=infinity
      TasksMax=infinity
      TimeoutStartSec=0
      Restart=always
      RestartSec=5s
      ExecStartPre=-/usr/sbin/modprobe br_netfilter
      ExecStartPre=-/usr/sbin/modprobe overlay
      ExecStart=/usr/local/bin/k3s server

      [Install]
      WantedBy=multi-user.target
    create: true
    owner: root
    group: root
    mode: 0644

- name: Ensure k3s api server is reachable
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp

# metrics-server scrapes it and autoscaling needs access to it as well
- name: Ensure pods can reach the kubelet
  community.general.ufw:
    rule: allow
    from_ip: 10.42.0.0/16
    port: "10250"
    proto: tcp

- name: Ensure k3s is enabled and restarted to pick up binary, config and service changes
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: restarted
    daemon_reload: true

# Only ever executed on dev, as this leaks full admin rights to the cluster!
- name: Ensure k3s kubeconfig is copied to the controller
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../.direnv/kubeconfig-vagrant-{{ domain }}.yaml"
    flat: true
  when: k3s_fetch_kubeconfig_leaking_admin_access | default(false)

