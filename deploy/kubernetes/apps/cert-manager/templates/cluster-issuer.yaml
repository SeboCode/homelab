---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: digitalocean-dns-letsencrypt-issuer
spec:
  acme:
    server: {{ .Values.acmeServer }}
    email: acme@mikemarti.ch
    privateKeySecretRef:
      name: letsencrypt-dns-account-key # created by cert-manager
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: digitalocean-dns-credentials
              key: api-token

