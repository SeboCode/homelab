---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-netpol-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      connectsToMeilisearch: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: meilisearch
      ports:
        - protocol: TCP
          port: {{ .Values.meilisearch.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meilisearch-netpol-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: meilisearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              connectsToMeilisearch: "true"
      ports:
        - protocol: TCP
          port: {{ .Values.meilisearch.port }}
