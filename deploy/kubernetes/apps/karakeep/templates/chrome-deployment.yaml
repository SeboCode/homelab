---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
        connectsToInternet: "true"
    spec:
      containers:
        - name: chrome
          # Swapped from gcr.io/zenika-hub/alpine-chrome (same content/tag) to the Docker Hub
          # mirror: GCR billing is disabled on the upstream zenika-hub project, so the gcr.io
          # image is unpullable (see karakeep-app/karakeep#3000). Not an upgrade — identical
          # tag, identical args.
          image: docker.io/zenika/alpine-chrome:{{ .Values.chrome.image.tag }}{{ with .Values.chrome.image.digest }}@{{ . }}{{ end }}
          # Verbatim from the Ansible role's container_command. Keep --disable-dev-shm-usage
          # (default 64MB /dev/shm is otherwise too small) and --no-sandbox (allows Chrome to
          # run without extra privileges) — do not compensate with a securityContext.
          args:
            - "--no-sandbox"
            - "--disable-gpu"
            - "--disable-dev-shm-usage"
            - "--remote-debugging-address=0.0.0.0"
            - "--remote-debugging-port={{ .Values.chrome.port }}"
            - "--hide-scrollbars"
          ports:
            - containerPort: {{ .Values.chrome.port }}
          volumeMounts:
            # chrome has no real persistent-data need. This mounts the shared PVC under a
            # throwaway subPath purely to inherit WaitForFirstConsumer scheduling, so chrome
            # is pinned to the same node as server/meilisearch (mirrors immich's
            # machine-learning component, which does the same trick for its /cache mount).
            - name: storage
              mountPath: /chrome-scratch
              subPath: chrome-scratch
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.namespace }}-storage
