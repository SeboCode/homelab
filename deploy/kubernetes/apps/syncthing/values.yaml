---
namespace: syncthing
storage:
  # Metadata only on a hostPath PV; the real limit is the ZFS pool on charon.
  capacity: 10Gi
server:
  image:
    tag: "2.0.15"
  port: 8384
  syncContainerPort: 22000
  syncServicePort: 21001
  # Syncthing uses this user name and the credentials in the secret to protect the
  # webserver from being modified by unprivileged users. There is no user management
  # in the application.
  guiUsername: "admin"

