---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sync-netpol-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: server
  policyTypes:
    - Ingress
  ingress:
    # The sync port is reached via hostPort, not through a proxy, so peers arrive from
    # anywhere on the LAN / tailscale network. Discovery and relays are disabled, so
    # this is the only path in. Filtered on the container's own port (syncContainerPort),
    # not the host port (syncHostPort).
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: {{ .Values.server.syncContainerPort }}
        - protocol: UDP
          port: {{ .Values.server.syncContainerPort }}

