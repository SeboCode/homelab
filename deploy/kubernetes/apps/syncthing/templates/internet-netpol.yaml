---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: internet-netpol-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      connectsToInternet: "true"
  policyTypes:
    - Egress
  egress:
    # Discovery and relays are disabled, so Syncthing dials configured peer addresses
    # directly over the LAN or tailscale. Covers the LAN as well; in-cluster traffic
    # stays denied so the per-component policies remain the only way pods reach
    # each other.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - {{ .Values.cluster.podCidr }}
              - {{ .Values.cluster.serviceCidr }}
