---
apiVersion: v1
kind: Service
metadata:
  name: sync
  namespace: {{ .Values.namespace }}
spec:
  # Exposed on the nodes by k3s ServiceLB. Peers dial charon on syncServicePort
  # directly; discovery and relays are disabled.
  type: LoadBalancer
  selector:
    app: server
  ports:
    - name: sync-tcp
      port: {{ .Values.server.syncServicePort }}
      targetPort: {{ .Values.server.syncContainerPort }}
      protocol: TCP
    - name: sync-udp
      port: {{ .Values.server.syncServicePort }}
      targetPort: {{ .Values.server.syncContainerPort }}
      protocol: UDP

