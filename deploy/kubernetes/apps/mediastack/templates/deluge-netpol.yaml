{{-
  $args := dict
    "Values" .Values
    "Release" .Release
    "appName" "deluge"
    "port" .Values.deluge.port
-}}
{{ include "common.netpol.traefik" $args }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deluge-netpol-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      connectsToDeluge: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: deluge
      ports:
        - protocol: TCP
          port: 8112
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deluge-netpol-connects-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: deluge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              connectsToDeluge: "true"
      ports:
        - protocol: TCP
          port: 8112
---
# Deluge needs essentially unrestricted outbound TCP+UDP: BitTorrent peers and
# trackers are arbitrary, peer-chosen hosts/ports. See "Egress beyond the
# cluster" in the brief — a deliberate, scoped deviation from the repo's
# usual DNS-only egress default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deluge-netpol-internet-egress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: deluge
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
