---
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config-map
  namespace: {{ .Values.namespace }}
data:
  configuration.yaml: |
    default_config:

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        # This is not a viable option, if HA is exposed directly. The current setup only exposes it via
        # the reverse proxy and in the local environment due to the firewall configuration. As such,
        # this is acceptable.
    {{- range .Values.server.trustedProxies }}
        - {{ . | quote }}
    {{- end }}

    wake_on_lan:

    switch:
      - platform: wake_on_lan
        name: {{ .Values.server.wakeOnLan.name | quote }}
        mac: {{ .Values.server.wakeOnLan.mac | quote }}
        host: {{ .Values.server.wakeOnLan.host | quote }}
        broadcast_address: {{ .Values.server.wakeOnLan.broadcastAddress | quote }}
        turn_off:
          action: shell_command.turn_off_charon

    shell_command:
      turn_off_charon: "ssh -i /ssh/charon_wol_poweroff_ssh_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/config/.ssh/known_hosts {{ .Values.server.wakeOnLan.sshUser }}@{{ .Values.server.wakeOnLan.host }} {{ .Values.server.wakeOnLan.poweroffCommand }}"

