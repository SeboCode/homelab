---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: {{ .Values.namespace }}
spec:
  serviceName: database-headless
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: docker.io/postgres:{{ .Values.database.image.tag }}{{ with .Values.database.image.digest }}@{{ . }}{{ end }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.databaseName }}
            - name: POSTGRES_USER
              value: {{ .Values.database.databaseUsername }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: dbPassword
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: storage
              # postgres:18 moved its VOLUME target one level up from /var/lib/postgresql/data
              # (PGDATA is now versioned, e.g. /var/lib/postgresql/18/docker). Mount the parent
              # directory, matching what the Ansible role already mounts.
              mountPath: /var/lib/postgresql
              subPath: db-data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: miniflux-storage
