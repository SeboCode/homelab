---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  # Pi-hole writes to a shared PVC (config/dnsmasq/logs); avoid two pods touching
  # it at once during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
        connectsToInternet: "true"
    spec:
      containers:
        - name: server
          image: docker.io/pihole/pihole:{{ .Values.server.image.tag }}{{ with .Values.server.image.digest }}@{{ . }}{{ end }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: FTLCONF_webserver_port
              value: {{ .Values.server.port | quote }}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: secret
                  key: webserverApiPassword
            # If using Docker's default `bridge` network setting the dns listening mode should be set to "all"
            - name: FTLCONF_dns_listeningMode
              value: "all"
            - name: FTLCONF_dns_port
              value: {{ .Values.server.dnsPort | quote }}
            - name: FTLCONF_dns_upstreams
              value: {{ .Values.server.dnsUpstreams | quote }}
            # Array-type FTLCONF settings are semicolon-delimited, per upstream docs.
            - name: FTLCONF_misc_dnsmasq_lines
              value: {{ join ";" .Values.server.dnsmasqLines | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
            - name: dns-tcp
              containerPort: {{ .Values.server.dnsPort }}
              hostPort: {{ .Values.server.dnsHostPort }}
              protocol: TCP
            - name: dns-udp
              containerPort: {{ .Values.server.dnsPort }}
              hostPort: {{ .Values.server.dnsHostPort }}
              protocol: UDP
          volumeMounts:
            - name: storage
              mountPath: /etc/pihole
              subPath: config
            - name: storage
              mountPath: /etc/dnsmasq.d
              subPath: dnsmasq
            - name: storage
              mountPath: /var/log/pihole
              subPath: logs
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: pihole-storage
