---
# The image's own entrypoint (/init.sh) only seeds /config/settings.json from its
# built-in defaults when the file is absent. Shipping it as a ConfigMap keeps the
# port in sync with .Values.server.port instead of duplicating it as a literal here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: server-config-map
  namespace: {{ .Values.namespace }}
data:
  settings.json: |
    {
      "port": {{ .Values.server.port }},
      "baseURL": "",
      "address": "",
      "log": "stdout",
      "database": "/database/filebrowser.db",
      "root": "/srv"
    }
