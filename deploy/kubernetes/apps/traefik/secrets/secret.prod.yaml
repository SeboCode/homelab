---
# TEMPLATE ONLY. Before deploying to prod:
#   1. Replace the users line with a real htpasswd bcrypt line
#      (e.g. `htpasswd -nB admin`).
#   2. Encrypt this file with sops: `sops -e -i secret.prod.yaml`.
#   3. Rename to secret.prod.enc.yaml so the SopsSecrets operator picks it up.
#   4. Never commit the unencrypted real values.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth-secret
  namespace: traefik
type: Opaque
stringData:
  users: |
    admin:REPLACE_ME
