---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: machine-learning
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machine-learning
  template:
    metadata:
      labels:
        app: machine-learning
    spec:
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:{{ .Values.machineLearning.image.tag }}{{ with .Values.machineLearning.image.digest }}@{{ . }}{{ end }}
          ports:
            - containerPort: 3003
          volumeMounts:
            - name: storage
              mountPath: /cache
              subPath: machine-learning-cache
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: immich-storage

